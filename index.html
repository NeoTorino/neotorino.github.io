<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Moved</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px 24px;
            max-width: 600px;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 16px;
        }

        p {
            font-size: 17px;
            color: #64748b;
            line-height: 1.7;
        }

        .link {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .link:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 50px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🚀</div>

        <h1>We've moved!</h1>

        <p>
            This website has moved to a new home.
            You can now find us at our new website.
        </p>

        <a class="link" href="https://justorgs.com">
            Visit justorgs.com →
        </a>

        <div class="footer">
            Thank you for visiting.
        </div>
    </div>
</body>
</html>
