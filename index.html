<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Jobs - Job Finder</title>
<style>
  :root { --blue: #000064; --grey: #6c757d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f4f6fb; color: #333; }
  header { background: var(--blue); color: #fff; padding: 1.5rem 1rem 1rem; text-align: center; }
  header h1 { margin: 0; font-size: 1.8rem; }
  header nav { margin-top: .9rem; display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem; }
  header nav a { color: #fff; text-decoration: none; padding: .35rem .9rem; border-radius: 999px;
                 font-size: .9rem; opacity: .85; }
  header nav a:hover { opacity: 1; background: rgba(255,255,255,.12); }
  header nav a[aria-current="page"] { background: #fff; color: var(--blue); opacity: 1; font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 1rem; }
  footer { text-align: center; padding: 1rem 1rem 2.5rem; color: var(--grey); font-size: .85rem; }
  footer .stamp { display: inline-flex; align-items: center; gap: .6rem; background: #fff;
                  border: 1px solid #e3e6ef; border-radius: 999px; padding: .5rem 1.1rem;
                  box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  footer .stamp strong { color: var(--blue); font-weight: 600; }
  footer .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #667eea;
                animation: pulse 2.4s infinite; }
  footer .site { margin-top: .75rem; font-size: .75rem; letter-spacing: .5px; opacity: .8; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(102,126,234,.55); }
    70%  { box-shadow: 0 0 0 8px rgba(102,126,234,0); }
    100% { box-shadow: 0 0 0 0 rgba(102,126,234,0); }
  }
  @media (prefers-reduced-motion: reduce) { footer .dot { animation: none; } }
  .grid { display: grid; gap: 1rem; margin-bottom: 1.5rem; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .charts { grid-template-columns: 2fr 1fr; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .card, .panel { background: #fff; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .card { padding: 1.25rem 1rem; text-align: center; }
  .num { font-size: 2.2rem; font-weight: 700; color: var(--blue); }
  .label { color: var(--grey); text-transform: uppercase; letter-spacing: 1px; font-size: .8rem; }
  .note { color: var(--grey); font-size: .8rem; margin-top: .35rem; min-height: 1em; }
  .panel { padding: 1.25rem; }
  .panel h2 { margin: 0 0 1rem; font-size: 1.1rem; text-align: center; }
  .panel h2 + .small-note { margin-top: -.75rem; }
  .small-note { color: var(--grey); font-size: .75rem; text-align: center; margin: 0 0 1rem; }
  .chart-box { position: relative; height: 380px; }
  .cloud { display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
           gap: 6px 16px; padding: 1.5rem 1rem; min-height: 360px; }
  .cloud span { line-height: 1.2; }
  .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-bottom: .75rem; }
  .tab { border: 1px solid var(--blue); background: #fff; color: var(--blue); border-radius: 999px;
         padding: .4rem 1rem; font-size: .9rem; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--blue); color: #fff; }
  .muted { color: var(--grey); font-size: .85rem; text-align: center; margin: 0 0 1rem; }
  .jobs { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  a.job { display: block; padding: 1rem; border: 1px solid #e3e6ef; border-radius: 12px;
          color: inherit; text-decoration: none; background: #fff;
          transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  a.job:hover, a.job:focus-visible { transform: translateY(-3px); border-color: var(--blue);
          box-shadow: 0 8px 18px rgba(0,0,0,.12); outline: none; }
  .job-title { font-weight: 600; color: var(--blue); margin-bottom: .35rem; overflow-wrap: anywhere; }
  .job-org { font-size: .9rem; color: #333; margin-bottom: .35rem; overflow-wrap: anywhere; }
  .job-loc { font-size: .85rem; color: var(--grey); }
  .more { text-align: center; margin-top: 1rem; }
  .more button { border: 0; background: var(--blue); color: #fff; border-radius: 8px;
                 padding: .55rem 1.4rem; cursor: pointer; }
  .filter { display: block; width: 100%; max-width: 480px; margin: 0 auto 1rem; padding: .6rem 1rem;
            border: 1px solid #cfd4e2; border-radius: 999px; font-size: 1rem; }
  .filter:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,0,100,.15); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: .75rem 1rem; text-align: center; border-bottom: 1px solid #f0f1f5; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #fafbfc; border-bottom: 2px solid #e9ecef; font-weight: 500; color: #495057;
       white-space: nowrap; }
  th button { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; }
  .ind { color: var(--grey); opacity: .6; margin-left: .25rem; }
  tbody tr:hover td { background: #f8f9fa; }
  td.org-name { font-weight: 500; color: #212529; overflow-wrap: anywhere; }
  .badge { background: #e3f2fd; color: #1565c0; padding: .25rem .75rem; border-radius: 12px;
           font-weight: 500; font-size: .85rem; display: inline-block; min-width: 50px; }
  .btn { display: inline-block; padding: .35rem .75rem; font-size: .75rem; font-weight: 500;
         border: 1px solid; border-radius: 4px; text-decoration: none; white-space: nowrap; }
  .btn-careers { color: #3b82f6; border-color: #3b82f6; }
  .btn-careers:hover { background: #3b82f6; color: #fff; }
  .btn-jobs { color: #16a34a; border-color: #16a34a; }
  .btn-jobs:hover { background: #16a34a; color: #fff; }
  .na { color: var(--grey); }
  .narrow { max-width: 800px; margin: 0 auto; line-height: 1.6; }
  .narrow section { margin-bottom: 2rem; }
  .narrow h2 { color: var(--blue); }
  .narrow a { color: var(--blue); }
  .disclaimer { background: #e7f1ff; border: 1px solid #b6d4fe; border-radius: 10px; padding: 1rem 1.25rem; }
  .disclaimer h3 { margin-top: 0; }
</style>
</head>
<body>
<header>
  <h1>Job Finder</h1>
  <nav><a href="index.html" aria-current="page">Jobs</a><a href="organisations.html">Organisations</a><a href="insights.html">Insights</a><a href="about.html">About</a></nav>
</header>
<main>

  <section class="panel" id="newJobsPanel" hidden>
    <div class="tabs" id="tabs" role="tablist"></div>
    <input type="search" id="filter" class="filter" autocomplete="off"
           placeholder="Filter by job title or organisation…" aria-label="Filter jobs">
    <p class="muted" id="jobsSummary"></p>
    <div class="jobs" id="jobs"></div>
    <div class="more"><button id="more" type="button">Show more</button></div>
  </section>

</main>
<footer>
  <div class="stamp"><span class="dot" aria-hidden="true"></span>
    <span>Last updated <strong><time datetime="2026-11-14T22:22:20+00:00">14 November 2026, 22:22 UTC</time></strong></span></div>
  <div class="site">Job Finder</div>
</footer>
<script id="data" type="application/json">{"new_jobs": [{"key": "day", "label": "Last day", "days": 1, "total": 4466, "files": ["data/jobs-day-001.json"]}, {"key": "week", "label": "Last week", "days": 7, "total": 33469, "files": ["data/jobs-week-001.json", "data/jobs-week-002.json"]}, {"key": "month", "label": "Last month", "days": 30, "total": 108584, "files": ["data/jobs-month-001.json", "data/jobs-month-002.json", "data/jobs-month-003.json", "data/jobs-month-004.json", "data/jobs-month-005.json", "data/jobs-month-006.json"]}, {"key": "quarter", "label": "Last 3 months", "days": 90, "total": 162709, "files": ["data/jobs-quarter-001.json", "data/jobs-quarter-002.json", "data/jobs-quarter-003.json", "data/jobs-quarter-004.json", "data/jobs-quarter-005.json", "data/jobs-quarter-006.json", "data/jobs-quarter-007.json", "data/jobs-quarter-008.json", "data/jobs-quarter-009.json"]}]}</script>

<script>

const D = JSON.parse(document.getElementById('data').textContent);
const nf = new Intl.NumberFormat('en-GB');
const NEW = D.new_jobs || [];
if (NEW.length) {
  const PAGE = 24;
  let active = 0, shown = PAGE, term = '';
  const panel = document.getElementById('newJobsPanel');
  const tabsEl = document.getElementById('tabs');
  const jobsEl = document.getElementById('jobs');
  const summaryEl = document.getElementById('jobsSummary');
  const moreBtn = document.getElementById('more');
  const filterEl = document.getElementById('filter');
  panel.hidden = false;

  // Arriving from the Organisations page: ?q=Name pre-fills the filter and uses the longest period
  const initial = new URLSearchParams(location.search).get('q') || '';
  if (initial) {
    term = initial; filterEl.value = initial;
    active = NEW.reduce((best, g, i) => g.days > NEW[best].days ? i : best, 0);
  }

  // Only http(s) links are used, so a bad value in the data can never become a javascript: link
  function safeUrl(u) {
    try {
      const p = new URL(u);
      return (p.protocol === 'https:' || p.protocol === 'http:') ? p.href : null;
    } catch (e) { return null; }
  }
  // Lower-case and strip accents so "zurich" finds "Zürich"
  const fold = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  function prepare(jobs) {
    return jobs
      .map(j => Object.assign({}, j, { href: safeUrl(j.url) }))
      .filter(j => j.href)
      .map(j => Object.assign(j, { hay: fold(j.title + ' ' + (j.organisation || '')) }));
  }

  // Each period's jobs live in data/jobs-*.json and are fetched the first time its tab is opened
  NEW.forEach(grp => { grp.valid = []; grp.loaded = false; grp.failed = false; grp.loading = null; });

  function loadGroup(grp) {
    if (grp.loading) return grp.loading;
    // Start every download at once, but append in order so the newest jobs appear first
    const requests = grp.files.map(f =>
      fetch(f).then(r => (r.ok ? r.json() : null)).catch(() => null));
    grp.loading = (async () => {
      for (const req of requests) {
        const jobs = await req;
        if (!jobs) { grp.failed = true; break; }
        grp.valid.push(...prepare(jobs));
        if (grp === NEW[active]) renderJobs();
      }
      grp.loaded = !grp.failed;
      if (grp === NEW[active]) renderJobs(); else updateTabs();
    })();
    return grp.loading;
  }

  function matching(grp) {
    const words = fold(term).split(/\s+/).filter(Boolean);
    return words.length ? grp.valid.filter(j => words.every(w => j.hay.includes(w))) : grp.valid;
  }

  // Tab count: the period total with no filter, otherwise the number of matching jobs loaded.
  // A "+" is added when the period holds more jobs than are loaded, so the count is a minimum.
  function tabCount(grp) {
    if (!term.trim()) return nf.format(grp.total);
    if (!grp.loaded && !grp.valid.length) return '…';
    return nf.format(matching(grp).length) + (grp.total > grp.valid.length ? '+' : '');
  }
  function updateTabs() {
    [...tabsEl.children].forEach((b, i) => {
      b.textContent = NEW[i].label + ' (' + tabCount(NEW[i]) + ')';
    });
  }

  function renderJobs() {
    const grp = NEW[active];
    const list = matching(grp);
    const visible = Math.min(shown, list.length);
    jobsEl.replaceChildren();
    list.slice(0, visible).forEach(j => {
      const a = document.createElement('a');
      a.className = 'job'; a.href = j.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      const t = document.createElement('div'); t.className = 'job-title'; t.textContent = j.title;
      a.appendChild(t);
      if (j.organisation) {
        const o = document.createElement('div'); o.className = 'job-org'; o.textContent = j.organisation;
        a.appendChild(o);
      }
      const l = document.createElement('div'); l.className = 'job-loc';
      l.textContent = j.location || 'Location not stated';
      a.appendChild(l);
      jobsEl.appendChild(a);
    });

    if (grp.failed) {
      summaryEl.textContent = 'Could not load all the job data. Please reload the page.';
    } else if (!grp.loaded && !grp.valid.length) {
      summaryEl.textContent = 'Loading jobs…';
    } else if (!grp.valid.length) {
      summaryEl.textContent = 'No jobs in this period.';
    } else if (term.trim()) {
      summaryEl.textContent = nf.format(list.length) + ' of ' + nf.format(grp.valid.length) +
        ' loaded jobs match your filter' + (grp.loaded ? '' : ' (still loading…)');
    } else {
      summaryEl.textContent = 'Showing ' + nf.format(visible) + ' of ' + nf.format(grp.total) +
        ' jobs, newest first' +
        (grp.loaded && grp.total > grp.valid.length
          ? ' (the newest ' + nf.format(grp.valid.length) + ' are searchable)' : '');
    }
    moreBtn.hidden = visible >= list.length;
    updateTabs();
  }

  function syncTabs() {
    [...tabsEl.children].forEach((b, i) => b.setAttribute('aria-selected', i === active ? 'true' : 'false'));
  }
  NEW.forEach((grp, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
    b.addEventListener('click', () => {
      active = i; shown = PAGE; syncTabs(); renderJobs(); loadGroup(NEW[i]);
    });
    tabsEl.appendChild(b);
  });
  moreBtn.addEventListener('click', () => { shown += PAGE; renderJobs(); });

  let timer = null;
  filterEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { term = filterEl.value; shown = PAGE; renderJobs(); }, 150);
  });

  syncTabs(); renderJobs(); loadGroup(NEW[active]);
}

</script>
</body>
</html>
