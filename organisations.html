<style>
  :root { --blue: #000064; --grey: #6c757d; }

  header { background: var(--blue); color: #fff; padding: 1.5rem 1rem 1rem; text-align: center; }

  main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 1rem; }
  footer { text-align: center; padding: 1rem 1rem 2.5rem; color: var(--grey); font-size: .85rem; }
  footer .stamp { display: inline-flex; align-items: center; gap: .6rem; background: #fff;
                  border: 1px solid #e3e6ef; border-radius: 999px; padding: .5rem 1.1rem;
                  box-shadow: 0 4px 14px rgba(0,0,0,.06); }

  .grid { display: grid; gap: 1rem; margin-bottom: 1.5rem; }

         padding: .4rem 1rem; font-size: .9rem; cursor: pointer; }

  .jobs { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  a.job { display: block; padding: 1rem; border: 1px solid #e3e6ef; border-radius: 12px;

          transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  a.job:hover, a.job:focus-visible { transform: translateY(-3px); border-color: var(--blue);

  .job-title { font-weight: 600; color: var(--blue); margin-bottom: .35rem; overflow-wrap: anywhere; }
  .job-org { font-size: .9rem; color: #333; margin-bottom: .35rem; overflow-wrap: anywhere; }
  .job-loc { font-size: .85rem; color: var(--grey); }
  .more { text-align: center; margin-top: 1rem; }
  .more button { border: 0; background: var(--blue); color: #fff; border-radius: 8px;
                 padding: .55rem 1.4rem; cursor: pointer; }
  .filter { display: block; width: 100%; max-width: 480px; margin: 0 auto 1rem; padding: .6rem 1rem;

  .filter:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,0,100,.15); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: .75rem 1rem; text-align: center; border-bottom: 1px solid #f0f1f5; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #fafbfc; border-bottom: 2px solid #e9ecef; font-weight: 500; color: #495057;
       white-space: nowrap; }
  th button { background: none; border: 0; font: inherit; color: inherit; cursor: pointer; padding: 0; }
  .ind { color: var(--grey); opacity: .6; margin-left: .25rem; }
  tbody tr:hover td { background: #f8f9fa; }
  td.org-name { font-weight: 500; color: #212529; overflow-wrap: anywhere; }
  .badge { background: #e3f2fd; color: #1565c0; padding: .25rem .75rem; border-radius: 12px;
           font-weight: 500; font-size: .85rem; display: inline-block; min-width: 50px; }
  .btn { display: inline-block; padding: .35rem .75rem; font-size: .75rem; font-weight: 500;
         border: 1px solid; border-radius: 4px; text-decoration: none; white-space: nowrap; }
  .btn-careers { color: #3b82f6; border-color: #3b82f6; }
  .btn-careers:hover { background: #3b82f6; color: #fff; }
  .btn-jobs { color: #16a34a; border-color: #16a34a; }

  .na { color: var(--grey); }
  .narrow { max-width: 800px; margin: 0 auto; line-height: 1.6; }
  .narrow section { margin-bottom: 2rem; }

  .narrow a { color: var(--blue); }
  .disclaimer { background: #e7f1ff; border: 1px solid #b6d4fe; border-radius: 10px; padding: 1rem 1.25rem; }

<script>

const D = JSON.parse(document.getElementById('data').textContent);
const nf = new Intl.NumberFormat('en-GB');
const bodyEl = document.getElementById('body');
const filterEl = document.getElementById('filter');
const summaryEl = document.getElementById('summary');
let sort = { col: 'name', dir: 'asc' };

document.getElementById('windowNote').textContent =
  'Organisations with jobs posted in the last ' + D.window_days +
  (D.window_days === 1 ? ' day' : ' days');

const fold = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const ORGS = (D.organizations || []).map(o => Object.assign({}, o, { hay: fold(o.name) }));

function safeUrl(u) {
  try {
    const p = new URL(u);
    return (p.protocol === 'https:' || p.protocol === 'http:') ? p.href : null;
  } catch (e) { return null; }
}

function formatDate(s) {
  if (!s) return 'N/A';
  const d = new Date(s);
  if (isNaN(d.getTime())) return 'N/A';
  const n = new Date();
  const days = Math.floor((Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate()) -
                           Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())) / 86400000);
  if (days <= 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 30) return days + ' days ago';
  return '30+ days ago';
}

function cmp(a, b) {
  let r;
  if (sort.col === 'name') r = a.name.localeCompare(b.name, 'en-GB', { sensitivity: 'base' });
  else if (sort.col === 'jobs') r = a.job_count - b.job_count;
  else r = (a.last_updated || '').localeCompare(b.last_updated || '');   // yyyy-mm-dd sorts as text
  return sort.dir === 'asc' ? r : -r;
}

function cell(cls) {
  const td = document.createElement('td');
  if (cls) td.className = cls;
  return td;
}

function render() {
  const words = fold(filterEl.value).split(/\s+/).filter(Boolean);
  const rows = ORGS.filter(o => words.every(w => o.hay.includes(w))).sort(cmp);
  bodyEl.replaceChildren();

  if (!rows.length) {
    const tr = document.createElement('tr'), td = cell();
    td.colSpan = 5; td.textContent = 'No organisations found';
    tr.appendChild(td); bodyEl.appendChild(tr);
  }
  rows.forEach(o => {
    const tr = document.createElement('tr');

    const name = cell('org-name'); name.textContent = o.name; tr.appendChild(name);

    const jobs = cell(), badge = document.createElement('span');
    badge.className = 'badge'; badge.textContent = nf.format(o.job_count);
    jobs.appendChild(badge); tr.appendChild(jobs);

    const date = cell(); date.textContent = formatDate(o.last_updated);
    if (o.last_updated) date.title = o.last_updated;
    tr.appendChild(date);

    const careers = cell(), href = safeUrl(o.careers_url);
    if (href) {
      const a = document.createElement('a');
      a.className = 'btn btn-careers'; a.href = href; a.target = '_blank';
      a.rel = 'noopener noreferrer'; a.textContent = 'Visit Careers';
      careers.appendChild(a);
    } else {
      const s = document.createElement('span'); s.className = 'na'; s.textContent = 'N/A';
      careers.appendChild(s);
    }
    tr.appendChild(careers);

    const view = cell(), v = document.createElement('a');
    v.className = 'btn btn-jobs'; v.textContent = 'View Jobs';
    v.href = 'index.html?q=' + encodeURIComponent(o.name);
    view.appendChild(v); tr.appendChild(view);

    bodyEl.appendChild(tr);
  });

  summaryEl.textContent = words.length
    ? nf.format(rows.length) + ' of ' + nf.format(ORGS.length) + ' organisations match your filter'
    : nf.format(ORGS.length) + ' organisations';

  document.querySelectorAll('th button').forEach(b => {
    const ind = b.querySelector('.ind');
    const on = b.dataset.col === sort.col;
    ind.textContent = on ? (sort.dir === 'asc' ? '↑' : '↓') : '⇅';
    ind.style.opacity = on ? '1' : '.6';
  });
}

document.querySelectorAll('th button').forEach(b => b.addEventListener('click', () => {
  const col = b.dataset.col;
  sort = { col, dir: (sort.col === col && sort.dir === 'asc') ? 'desc' : 'asc' };
  render();
}));

let timer = null;
filterEl.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 150); });
render();

</script>
